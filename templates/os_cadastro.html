{% extends "base.html" %}
{% block title %}Nova OS{% endblock %}
{% block page_title %}Nova Ordem de Serviço{% endblock %}

{% block content %}
<div style="max-width:720px;">

  {% if erro %}
  <div class="alert alert-danger">⚠️ {{ erro }}</div>
  {% endif %}

  <div class="card">
    <div class="card-header">
      <span class="card-title">➕ Cadastrar Nova OS</span>
    </div>
    <div class="card-body">
      <form method="POST" action="/os/nova">

        <div class="form-grid-3">
          <div class="form-group">
            <label for="numero">Número da OS *</label>
            <input type="text" id="numero" name="numero" required placeholder="Ex: OS-2024-001" />
          </div>
          <div class="form-group">
            <label for="data_abertura">Data de Abertura *</label>
            <input type="date" id="data_abertura" name="data_abertura" value="{{ hoje }}" required />
          </div>
          <div class="form-group">
            <label for="prazo">Prazo de Entrega *</label>
            <input type="date" id="prazo" name="prazo" value="{{ prazo_default }}" required />
            <div style="font-size:.7rem;color:var(--text-muted);margin-top:3px;">Padrão: 15 dias corridos</div>
          </div>
        </div>

        <div class="form-group">
          <label for="cliente">Cliente *</label>
          <input type="text" id="cliente" name="cliente" required placeholder="Nome do cliente" />
        </div>

        <div class="form-group">
          <label for="descricao_peca">Descrição da Peça *</label>
          <input type="text" id="descricao_peca" name="descricao_peca" required
                 placeholder="Ex: Redutor de velocidade Falk modelo 2060J2" />
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="complexidade">Complexidade *</label>
            <select id="complexidade" name="complexidade" required>
              <option value="">Selecione…</option>
              {% for key, (label, icon) in complexidade.items() %}
              <option value="{{ key }}">{{ icon }} {{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="responsavel_desenhista">Responsável Desenhista *</label>
            <select id="responsavel_desenhista" name="responsavel_desenhista" required>
              <option value="">Selecione…</option>
              {% for d in desenhistas %}
              <option value="{{ d }}">{{ d }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="3"
                    placeholder="Informações adicionais, referências, especificações especiais…"></textarea>
        </div>

        <!-- Prazo visual -->
        <div id="prazo-info" class="alert alert-info" style="margin-bottom:0;display:none;">
          📅 <span id="prazo-dias"></span>
        </div>

        <hr />

        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <a href="/" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">✅ Criar OS</button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const abertura = document.getElementById('data_abertura');
  const prazo    = document.getElementById('prazo');
  const info     = document.getElementById('prazo-info');
  const dias     = document.getElementById('prazo-dias');

  function calcDias() {
    const a = new Date(abertura.value);
    const p = new Date(prazo.value);
    if (!isNaN(a) && !isNaN(p)) {
      const d = Math.round((p - a) / 86400000);
      info.style.display = 'flex';
      dias.textContent   = `${d} dias corridos de prazo`;
      info.className     = d < 10 ? 'alert alert-warning' : 'alert alert-info';
    }
  }
  abertura.addEventListener('change', calcDias);
  prazo.addEventListener('change', calcDias);
  calcDias();
</script>
{% endblock %}
