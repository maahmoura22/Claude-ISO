{% extends 'base.html' %}
{% block title %}Editar OS {{ os.numero }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-pencil me-2 text-accent"></i>Editar OS {{ os.numero }}</h1>
  <a href="{{ url_for('os_detalhe', os_id=os.id) }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Voltar
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card-eng">
      <form method="POST" action="{{ url_for('editar_os', os_id=os.id) }}">

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Cliente *</label>
            <input type="text" name="cliente" class="form-control" value="{{ os.cliente }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Complexidade *</label>
            <select name="complexidade" class="form-select" required>
              <option value="simples" {% if os.complexidade=='simples' %}selected{% endif %}>🟢 Simples</option>
              <option value="media"   {% if os.complexidade=='media'   %}selected{% endif %}>🟡 Média</option>
              <option value="complexa"{% if os.complexidade=='complexa'%}selected{% endif %}>🔴 Complexa</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição da Peça *</label>
          <input type="text" name="descricao_peca" class="form-control" value="{{ os.descricao_peca }}" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Prazo *</label>
            <input type="date" name="prazo" class="form-control"
                   value="{{ os.prazo.strftime('%Y-%m-%d') }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Desenhista *</label>
            <select name="responsavel_desenhista" class="form-select" required>
              {% for d in desenhistas %}
              <option value="{{ d }}" {% if os.responsavel_desenhista==d %}selected{% endif %}>{{ d }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Processista</label>
            <select name="processista" class="form-select">
              <option value="">A definir</option>
              {% for p in processistas %}
              <option value="{{ p }}" {% if os.processista==p %}selected{% endif %}>{{ p }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Observações</label>
          <textarea name="observacoes" class="form-control" rows="3">{{ os.observacoes or '' }}</textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-accent px-4">
            <i class="bi bi-check-circle me-1"></i>Salvar Alterações
          </button>
          <a href="{{ url_for('os_detalhe', os_id=os.id) }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
