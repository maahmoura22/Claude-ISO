{% extends 'base.html' %}
{% block title %}Nova OS{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1><i class="bi bi-plus-circle me-2 text-accent"></i>Nova Ordem de Serviço</h1>
    <small class="text-muted">Preencha todos os campos obrigatórios</small>
  </div>
  <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Voltar
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card-eng">
      <form method="POST" action="{{ url_for('nova_os') }}">

        <div class="section-title"><i class="bi bi-info-circle me-1"></i>Identificação</div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Número da OS *</label>
            <input type="text" name="numero" class="form-control" required
                   placeholder="ex: OS-2024-001">
          </div>
          <div class="col-md-4">
            <label class="form-label">Data de Abertura *</label>
            <input type="date" name="data_abertura" class="form-control"
                   value="{{ hoje }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Prazo (15 dias padrão) *</label>
            <input type="date" name="prazo" class="form-control"
                   value="{{ prazo_sugerido }}" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Cliente *</label>
            <input type="text" name="cliente" class="form-control" required
                   placeholder="Nome do cliente">
          </div>
          <div class="col-md-6">
            <label class="form-label">Complexidade *</label>
            <select name="complexidade" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="simples">🟢 Simples</option>
              <option value="media">🟡 Média</option>
              <option value="complexa">🔴 Complexa</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição da Peça *</label>
          <input type="text" name="descricao_peca" class="form-control" required
                 placeholder="ex: Redutor de velocidade 1:20, eixo de entrada ø80mm">
        </div>

        <div class="section-title mt-4"><i class="bi bi-people me-1"></i>Equipe</div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Desenhista Responsável *</label>
            <select name="responsavel_desenhista" class="form-select" required>
              <option value="">Selecione...</option>
              {% for d in desenhistas %}
              <option value="{{ d }}">{{ d }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Processista</label>
            <select name="processista" class="form-select">
              <option value="">A definir</option>
              {% for p in processistas %}
              <option value="{{ p }}">{{ p }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Observações</label>
          <textarea name="observacoes" class="form-control" rows="3"
                    placeholder="Informações adicionais sobre a OS..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-accent px-4">
            <i class="bi bi-check-circle me-2"></i>Cadastrar OS
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
