<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Gestão Engenharia{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --text2: #8b949e;
    --verde: #2ea043; --amarelo: #d29922; --vermelho: #da3633;
    --azul: #1f6feb; --roxo: #6e40c9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
  a { color: var(--azul); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Navbar */
  nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 56px; }
  nav .brand { font-weight: 700; font-size: 16px; color: var(--text); margin-right: 16px; }
  nav a.nav-link { color: var(--text2); padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  nav a.nav-link:hover, nav a.nav-link.active { background: var(--bg3); color: var(--text); text-decoration: none; }

  /* Layout */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }

  /* Cards */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card .num { font-size: 32px; font-weight: 700; }
  .stat-card .lbl { color: var(--text2); font-size: 12px; margin-top: 4px; }
  .stat-card.verde .num { color: var(--verde); }
  .stat-card.amarelo .num { color: var(--amarelo); }
  .stat-card.vermelho .num { color: var(--vermelho); }
  .stat-card.azul .num { color: var(--azul); }

  /* Tabela */
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--bg3); color: var(--text2); font-weight: 600; text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--bg3); }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-verde { background: #0d2818; color: var(--verde); border: 1px solid var(--verde); }
  .badge-amarelo { background: #2d2000; color: var(--amarelo); border: 1px solid var(--amarelo); }
  .badge-vermelho { background: #2d0a09; color: var(--vermelho); border: 1px solid var(--vermelho); }
  .badge-azul { background: #0c2a4a; color: var(--azul); border: 1px solid var(--azul); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: opacity .15s; }
  .btn:hover { opacity: .85; text-decoration: none; }
  .btn-primary { background: var(--azul); color: #fff; }
  .btn-verde { background: var(--verde); color: #fff; }
  .btn-vermelho { background: var(--vermelho); color: #fff; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn-ghost:hover { border-color: var(--text2); color: var(--text); }

  /* Forms */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
  input, select, textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 12px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); }
  textarea { resize: vertical; min-height: 80px; }

  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters select { width: auto; flex: 1; min-width: 160px; }

  /* Alert */
  .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
  .alert-vermelho { background: #2d0a09; border: 1px solid var(--vermelho); color: var(--vermelho); }

  /* Grid cols */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* Progress */
  .progress-bar { background: var(--bg3); border-radius: 4px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--verde); transition: width .3s; }
</style>
</head>
<body>
<nav>
  <span class="brand">⚙️ Engenharia</span>
  <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}">📊 Dashboard</a>
  <a href="{{ url_for('kanban') }}" class="nav-link {% if request.endpoint=='kanban' %}active{% endif %}">📋 Kanban</a>
  <a href="{{ url_for('erros') }}" class="nav-link {% if request.endpoint=='erros' %}active{% endif %}">⚠️ Erros</a>
  <a href="{{ url_for('produtividade') }}" class="nav-link {% if request.endpoint=='produtividade' %}active{% endif %}">📈 Produtividade</a>
  <a href="{{ url_for('nova_os') }}" class="nav-link {% if request.endpoint=='nova_os' %}active{% endif %}" style="margin-left:auto">➕ Nova OS</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
